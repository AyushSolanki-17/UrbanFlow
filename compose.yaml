services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.local/postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  s3mock:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"
      - "9191:9191"
    environment:
      initialBuckets: warehouse,lakehouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  trino:
    image: trinodb/trino:476
    ports:
      - "8080:8080"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
      - ./.local/spike-iceberg/warehouse:/Users/ayushsolanki/Desktop/Projects/UrbanFlow/.local/spike-iceberg/warehouse:ro
      - ./.local/spike-iceberg/warehouse:/tmp/Users/ayushsolanki/Desktop/Projects/UrbanFlow/.local/spike-iceberg/warehouse:ro
    depends_on:
      postgres:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
